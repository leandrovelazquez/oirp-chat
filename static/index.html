<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OIRP-chat — portfolio demo</title>
  <style>
    :root {
      --bg: #fafafa;
      --panel: #ffffff;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #e3e3e3;
      --accent: #b8002a; /* Carleton red, lightly */
      --user-bg: #ebf3ff;
      --bot-bg: #ffffff;
      --high: #1f7a3f;
      --medium: #b76b00;
      --low: #b8002a;
      --none: #6b6b6b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --panel: #232323;
        --text: #f0f0f0;
        --muted: #9a9a9a;
        --border: #333;
        --user-bg: #233042;
        --bot-bg: #232323;
        --high: #4ad27a;
        --medium: #e0a050;
        --low: #ff5b6b;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
    }
    .app {
      max-width: 820px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
    }
    header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    header h1 .accent { color: var(--accent); }
    header .meta {
      font-size: 12px;
      color: var(--muted);
    }
    header button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    header button:hover { background: var(--bg); }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
    }
    .msg {
      margin-bottom: 18px;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user { background: var(--user-bg); }
    .msg.bot { background: var(--bot-bg); }
    .msg .role {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .msg .body { font-size: 15px; }
    .msg .body code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 13px;
    }
    @media (prefers-color-scheme: dark) {
      .msg .body code { background: rgba(255,255,255,0.08); }
    }
    .meta-row {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.02em;
    }
    .badge.high { background: rgba(31,122,63,0.15); color: var(--high); }
    .badge.medium { background: rgba(183,107,0,0.15); color: var(--medium); }
    .badge.low { background: rgba(184,0,42,0.15); color: var(--low); }
    .badge.none { background: rgba(107,107,107,0.15); color: var(--none); }
    .badge.synthetic { background: rgba(90,60,200,0.14); color: #5a3cc8; }
    .badge.published { background: rgba(0,90,160,0.12); color: #005aa0; }
    @media (prefers-color-scheme: dark) {
      .badge.synthetic { color: #b3a2ff; }
      .badge.published { color: #7cc0ff; }
    }

    .trace {
      margin-top: 8px;
      font-size: 12px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      color: var(--muted);
      background: rgba(0,0,0,0.04);
      padding: 8px 10px;
      border-radius: 6px;
      display: none;
    }
    @media (prefers-color-scheme: dark) {
      .trace { background: rgba(255,255,255,0.04); }
    }
    .trace.shown { display: block; }
    .trace-toggle {
      cursor: pointer;
      color: var(--muted);
      text-decoration: underline;
      background: none;
      border: none;
      padding: 0;
      font-size: 12px;
      font-family: inherit;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    textarea {
      flex: 1;
      resize: none;
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      line-height: 1.4;
      min-height: 42px;
      max-height: 160px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    button.send {
      padding: 0 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }

    .placeholder {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }
    .placeholder h2 { margin-top: 0; font-size: 18px; }
    .examples {
      list-style: none;
      padding: 0;
      margin: 16px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .examples button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
    }
    .examples button:hover { border-color: var(--accent); }

    .numtable { margin-top: 10px; white-space: normal; font-size: 13px; overflow-x: auto; }
    .numtable table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    .numtable th, .numtable td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
    .numtable th.num, .numtable td.num { text-align: right; }
    .numtable .cap { color: var(--muted); font-size: 12px; margin: 4px 0; }
    .error {
      color: var(--low);
      font-size: 13px;
      padding: 8px 12px;
      background: rgba(184,0,42,0.08);
      border-radius: 6px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1><span class="accent">OIRP</span>-chat</h1>
        <div class="meta" id="info">loading…</div>
      </div>
      <button id="reset">Reset conversation</button>
    </header>

    <div id="messages">
      <div class="placeholder" id="placeholder">
        <h2>Ask about Carleton's institutional research data</h2>
        <p>Six KPIs are loaded from the semantic layer. Try one of these to start:</p>
        <ul class="examples">
          <li><button data-q="What percentage of first-year Carleton students rated their experience as good or excellent in 2023?">What percentage of first-year Carleton students rated their experience as good or excellent in 2023?</button></li>
          <li><button data-q="Compare HIPs participation between 3-year and 4-year programs in 2023.">Compare HIPs participation between 3-year and 4-year programs in 2023.</button></li>
          <li><button data-q="What was Carleton's first-year retention rate in 2022?">What was Carleton's first-year retention rate in 2022?</button> <em>(should refuse — not in verified store)</em></li>
          <li><button data-q="What KPIs can I ask you about?">What KPIs can I ask you about?</button></li>
        </ul>
      </div>
    </div>

    <form id="form">
      <textarea id="input" placeholder="Ask a question… (Enter to send, Shift-Enter for newline)" rows="1"></textarea>
      <button type="submit" class="send" id="send">Send</button>
    </form>
  </div>

<script>
const messagesEl = document.getElementById("messages");
const placeholderEl = document.getElementById("placeholder");
const inputEl = document.getElementById("input");
const formEl = document.getElementById("form");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");
const infoEl = document.getElementById("info");

// --- info banner ---
fetch("/api/info").then(r => r.json()).then(d => {
  if (d.error) {
    infoEl.textContent = "configuration error: " + d.error;
    return;
  }
  const cubes = d.cube_count ? ` · ${d.cube_count} synthetic cubes` : "";
  infoEl.textContent = `${d.kpi_count} published KPIs${cubes} · model: ${d.model}`;
}).catch(() => {
  infoEl.textContent = "couldn't load /api/info";
});

// --- DOM helpers ---
function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

// Minimal inline-formatting: backticks → <code>, **bold** → <strong>.
// Keep it tiny on purpose — we don't want to ship a markdown lib for a demo.
function lightFormat(s) {
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return out;
}

function appendMessage(role, text, extra) {
  if (placeholderEl && placeholderEl.parentNode) placeholderEl.remove();

  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const roleEl = document.createElement("div");
  roleEl.className = "role";
  roleEl.textContent = role === "user" ? "you" : "oirp-chat";
  msg.appendChild(roleEl);

  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = lightFormat(text);
  msg.appendChild(body);

  // The numbers, drawn from the tool results (display strings), not the prose.
  for (const t of (extra && extra.tables) || []) {
    const box = document.createElement("div");
    box.className = "numtable";
    const cls = (c) => (c.numeric ? ' class="num"' : "");
    box.innerHTML = `<div class="cap"><b>${escapeHtml(t.kind)}</b> · ${escapeHtml(t.title)}`
      + (t.subtitle ? `<br><span>${escapeHtml(t.subtitle)}</span>` : "") + `</div>`
      + `<table><thead><tr>${t.columns.map(c => `<th${cls(c)}>${escapeHtml(c.name)}</th>`).join("")}</tr></thead>`
      + `<tbody>${t.rows.map(r => `<tr>${t.columns.map((c, j) => `<td${cls(c)}>${escapeHtml(r[j] ?? "")}</td>`).join("")}</tr>`).join("")}</tbody></table>`
      + `<div class="cap"><span>${[t.data_as_of ? "as of " + t.data_as_of : "", t.stale ? "STALE" : "", ...(t.notes || [])]
          .filter(Boolean).map(escapeHtml).join(" · ")}</span></div>`;
    msg.appendChild(box);
  }

  // Questions it can answer instead, after a "can't answer"; or, after an
  // answer, next questions worked out from the query.
  const nextQs = extra ? ((extra.suggestions || []).length ? extra.suggestions : (extra.follow_ups || [])) : [];
  if (nextQs.length) {
    const box = document.createElement("div");
    box.className = "meta-row";
    for (const q of nextQs) {
      const b = document.createElement("button");
      b.className = "trace-toggle";
      b.textContent = "→ " + q;
      b.addEventListener("click", () => { if (!sendBtn.disabled) sendMessage(q); });
      box.appendChild(b);
    }
    msg.appendChild(box);
  }

  if (extra && extra.confidence) {
    const meta = document.createElement("div");
    meta.className = "meta-row";

    const badge = document.createElement("span");
    badge.className = "badge " + extra.confidence;
    badge.textContent = "confidence: " + extra.confidence;
    meta.appendChild(badge);

    if (extra.could_not_answer) {
      const chip = document.createElement("span");
      chip.className = "badge low";
      chip.textContent = "could not answer: " + extra.could_not_answer;
      meta.appendChild(chip);
    }
    if ((extra.tables || []).some(t => t.preliminary)) {
      const chip = document.createElement("span");
      chip.className = "badge synthetic";
      chip.textContent = "preliminary";
      meta.appendChild(chip);
    }

    if ((extra.unverified || []).length) {
      const chip = document.createElement("span");
      chip.className = "badge low";
      chip.textContent = "unverified numbers: " + extra.unverified.join(", ");
      meta.appendChild(chip);
    } else if (extra.numbers_checked) {
      const chip = document.createElement("span");
      chip.className = "badge high";
      chip.textContent = `${extra.numbers_checked} numbers checked` + (extra.number_retries ? ` (after ${extra.number_retries} rewrite)` : "");
      meta.appendChild(chip);
    }

    for (const src of (extra.sources || [])) {
      const chip = document.createElement("span");
      chip.className = "badge " + src;
      chip.textContent = src === "synthetic" ? "synthetic data" : "published source";
      meta.appendChild(chip);
    }

    if (extra.trace && extra.trace.length) {
      const toggle = document.createElement("button");
      toggle.className = "trace-toggle";
      toggle.textContent = `${extra.trace.length} tool call${extra.trace.length === 1 ? "" : "s"} — show`;
      const traceEl = document.createElement("div");
      traceEl.className = "trace";
      traceEl.textContent = extra.trace
        .map((c, i) => `${i + 1}. ${c.name}(${c.summary})` + (c.detail ? `\n   SQL: ${c.detail}` : ""))
        .join("\n");
      toggle.addEventListener("click", () => {
        const shown = traceEl.classList.toggle("shown");
        toggle.textContent = `${extra.trace.length} tool call${extra.trace.length === 1 ? "" : "s"} — ${shown ? "hide" : "show"}`;
      });
      meta.appendChild(toggle);
      msg.appendChild(meta);
      msg.appendChild(traceEl);
    } else {
      msg.appendChild(meta);
    }
  } else if (extra && extra.error) {
    const err = document.createElement("div");
    err.className = "error";
    err.textContent = extra.error;
    msg.appendChild(err);
  }

  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// --- send flow ---
async function sendMessage(text) {
  if (!text.trim()) return;
  appendMessage("user", text);
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;

  // Pending placeholder
  const pending = document.createElement("div");
  pending.className = "msg bot";
  pending.innerHTML = '<div class="role">oirp-chat</div><div class="body" style="color: var(--muted);">thinking…</div>';
  messagesEl.appendChild(pending);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ message: text }),
    });
    const data = await r.json();
    pending.remove();

    if (!r.ok || data.error) {
      const errMsg = data.detail || data.error || `HTTP ${r.status}`;
      const hint = data.hint ? `\n\n${data.hint}` : "";
      appendMessage("bot", "Something went wrong.", { error: errMsg + hint });
      return;
    }

    appendMessage("bot", data.text || "(empty response)", {
      confidence: data.confidence,
      sources: data.sources || [],
      trace: data.trace || [],
      tables: data.tables || [],
      numbers_checked: data.numbers_checked || 0,
      unverified: data.unverified || [],
      number_retries: data.number_retries || 0,
      could_not_answer: data.could_not_answer || null,
      suggestions: data.suggestions || [],
      follow_ups: data.follow_ups || [],
    });
  } catch (e) {
    pending.remove();
    appendMessage("bot", "Network error.", { error: String(e) });
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// --- form wiring ---
formEl.addEventListener("submit", (e) => {
  e.preventDefault();
  sendMessage(inputEl.value);
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
  }
});

// auto-grow textarea
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});

// example buttons (event delegation, since the placeholder gets removed)
document.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-q]");
  if (btn) sendMessage(btn.dataset.q);
});

// reset
resetBtn.addEventListener("click", async () => {
  if (!confirm("Clear the conversation?")) return;
  await fetch("/api/reset", { method: "POST", credentials: "same-origin" });
  messagesEl.innerHTML = "";
  // Restore the placeholder
  location.reload();
});

inputEl.focus();
</script>
</body>
</html>
