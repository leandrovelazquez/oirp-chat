# Manifest of OIRP source documents to download.
#
# This file is the single source of truth for what PDFs the project knows about.
# Edit it, run `python scripts/download_sources.py`, and the script will fetch
# any new/changed documents into data/pdfs/ and update data/pdfs/manifest.json
# with verified hashes.
#
# How to add a new PDF:
#   1. Find the URL on carleton.ca/oirp (or one of the linked Carleton sites).
#   2. Add a new [[source]] entry below.
#   3. Run scripts/download_sources.py.
#
# Verified sources are already filled in below — you can safely run
# download_sources.py against this manifest as-is.
#
# Fields:
#   id         — short slug used as the filename and as the key for downstream
#                extraction output. Snake_case, no spaces.
#   url        — direct URL to the PDF.
#   doc_type   — one of: nsse_summary, cusc_summary, cgpss_summary,
#                annual_report, operating_budget, departmental_measures, other.
#   year       — year the document describes (NOT necessarily the year it was
#                published). For surveys, the survey administration year.
#   title      — human-readable title; used in citations.
#   notes      — optional free text.

# ─────────────────────────────────────────────────────────────────────────────
# NSSE summaries (triennial)
# ─────────────────────────────────────────────────────────────────────────────

[[source]]
id = "nsse_2023_summary"
url = "https://carleton.ca/oirp/wp-content/uploads/sites/231/2025/11/nsse_2023_summary.pdf"
doc_type = "nsse_summary"
year = 2023
title = "NSSE 2023 Summary — Carleton University"
notes = "Verified URL. Re-uploaded by OIRP in November 2025 — sha256 in manifest will reflect that version."

