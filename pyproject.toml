[project]
name = "oirp-agent"
version = "0.1.0"
description = "Portfolio demo: a semantic-layer-grounded chat agent for Carleton OIRP-style institutional research data."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.97.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "duckdb>=1.1",
]

[project.optional-dependencies]
# `pip install -e ".[extract]"` to install PDF-extraction tooling.
# Kept optional so the core agent doesn't need these heavy deps at runtime.
extract = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10",
]
dev = [
    "pytest>=8",
]

[project.scripts]
oirp-agent = "oirp_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oirp_agent"]
