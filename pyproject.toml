[project]
name = "oirp-agent"
version = "0.1.0"
description = "Portfolio demo: a semantic-layer-grounded chat agent for Carleton OIRP-style institutional research data."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.97.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
oirp-agent = "oirp_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oirp_agent"]
