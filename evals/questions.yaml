# Eval suite for OIRP-chat.
#
# Run it:      python -m oirp_agent.evals            (calls the real model; prints cost)
# Check it:    python -m oirp_agent.evals --check    (free: validates this file and
#                                                     runs every expected query)
#
# Each entry is one question. A question passes when every check that applies
# to it passes:
#
#   expected_confidence   the confidence tier the turn should get (or a list of
#                         acceptable tiers)
#   expected_kpi          a KPI the agent must look up or search (`any` = any KPI
#                         tool; null = not checked)
#   expected_tool         a tool that must be called
#   expected_tool_input   a governed query whose RESULT ROWS the agent's own
#                         query_metric call must reproduce. Rows are compared,
#                         not query text, so an equivalent query passes.
#   expected_key_facts    strings that must appear in what the user sees: the
#                         answer text plus the number tables the page draws.
#                         Case, dashes and underscores are ignored. A list inside
#                         the list means "any one of these".
#   expected_refusal      true for questions the agent must decline (or decline
#                         the real figure for); reported as their own group
#   expected_could_not_answer
#                         the "can't answer" reason (no_data, person, limit,
#                         unclear; or a list), or `none` when it must answer.
#                         A reason must come with at least one suggested question.
#   follow_up             true = asked in the same conversation as the entry
#                         before it
#
# Every answer must also pass the number check: no number in the text that no
# tool returned.
#
# Structure follows the two-layer eval pattern: this file is the offline /
# pre-ship suite. Production traffic eval is out of scope for the portfolio
# version.

evals:

  # ---------- HIGH confidence: direct verified-value lookups ----------

  - id: high_overall_2023_first_year
    question: "What percentage of Carleton first-year students rated their experience as good or excellent in 2023?"
    expected_confidence: high
    expected_kpi: overall_experience_rating
    expected_key_facts:
      - "74"
      - "first-year"
      - "nsse_2023_summary.pdf"

  - id: high_overall_2023_final_year
    question: "And for final-year students?"
    follow_up: true
    expected_confidence: high
    expected_kpi: overall_experience_rating
    expected_key_facts:
      - "78"
      - "final-year"
    notes: "Tests multi-turn context — the agent should infer 'overall experience' from the prior question."

  - id: high_choose_again_distribution_first_year
    question: "What's the breakdown of how Carleton first-year students answered 'would you choose the same institution' in 2023?"
    expected_confidence: high
    expected_kpi: would_choose_same_institution
    expected_key_facts:
      - "31"  # definitely yes
      - "51"  # probably yes
      - "16"  # probably no
      - "2"   # definitely no

  - id: high_engagement_effective_teaching
    question: "How does Carleton compare to Ontario on Effective Teaching Practices?"
    expected_confidence: high
    expected_kpi: nsse_engagement_indicators
    expected_key_facts:
      - "higher"
      - "first-year"
      - "final-year"
      - "small"  # effect size caveat

  - id: high_hips_research_with_faculty_final_year
    question: "What percentage of Carleton final-year students participated in research with faculty in 2023?"
    expected_confidence: high
    expected_kpi: nsse_high_impact_practices
    expected_key_facts:
      - "27"
      - "research with faculty"
      - "higher"  # vs Ontario

  - id: high_hips_program_length_crosstab
    question: "Compare HIPs participation between 3-year and 4-year programs in 2023."
    expected_confidence: high
    expected_kpi: nsse_high_impact_practices
    expected_key_facts:
      - ["3-year", "three-year", "3 year"]
      - ["4-year", "four-year", "4 year"]
      - "39"  # 3-year at-least-one
      - "82"  # 4-year at-least-one
      - "12"  # 3-year two-or-more
      - "55"  # 4-year two-or-more

  - id: high_hips_yoy_study_abroad
    question: "Has study abroad participation changed since 2020?"
    expected_confidence: high
    expected_kpi: nsse_high_impact_practices
    expected_key_facts:
      - "7"  # 2020 value
      - "5"  # 2023 value
      - ["decrease", "decline", "fell", "dropped", "down", "lower"]
      - "pandemic"  # OIRP's published attribution

  - id: high_engagement_yoy_collaborative_first_year
    question: "Did Carleton's first-year Collaborative Learning indicator change between 2020 and 2023?"
    expected_confidence: high
    expected_kpi: nsse_engagement_indicators
    expected_key_facts:
      - "33.13"
      - "30.31"
      - ["decrease", "decline", "fell", "dropped", "down", "lower"]

  - id: high_retention_legacy_2000
    question: "What was the one-year retention rate for the 2000 entering cohort of full-time first-year students?"
    expected_confidence: high
    expected_kpi: first_year_retention_rate
    expected_key_facts:
      - "85"
      - "2000"
      - "full-time"

  # ---------- MEDIUM confidence: methodology, definitions, synthesis ----------

  - id: medium_what_is_aopa_equivalent
    question: "What's the difference between retention and progression?"
    # high when it also looks up a published rate to illustrate (the prompt
    # requires a lookup for any number it writes)
    expected_confidence: [medium, high]
    expected_kpi: first_year_retention_rate
    expected_key_facts:
      - "stay"
      - "advance"
      - "progression"
      - ["lower or equal", "lower than or equal", "at most", "can't exceed", "cannot exceed",
         "never higher", "no higher", "lower than retention", "below retention", "smaller"]

  - id: medium_nsse_methodology
    question: "How was NSSE 2023 administered at Carleton, and what was the response rate?"
    expected_confidence: [medium, high]   # high when the response rate is looked up as a value
    expected_kpi: any
    expected_key_facts:
      - "21%"
      - "2,030"
      - "first-year"
      - "final-year"

  - id: medium_ontario_consortium
    question: "What is the Ontario consortium and how does it factor into NSSE results?"
    expected_confidence: [medium, high]
    expected_kpi: any
    expected_key_facts:
      - "19"
      - "consortium"
      - "excluding Carleton"

  - id: medium_engagement_indicator_explanation
    question: "What are NSSE Engagement Indicators?"
    expected_confidence: medium
    expected_kpi: nsse_engagement_indicators
    expected_key_facts:
      - ["ten", "10"]
      - ["0-60", "0 to 60", "zero to 60", "zero to sixty"]
      - "Academic Challenge"
      - "Learning with Peers"
      - "Experiences with Faculty"
      - "Campus Environment"

  - id: medium_enrolment_size_qualitative
    question: "Roughly how big are Carleton's undergraduate faculties relative to each other?"
    expected_confidence: [medium, high]
    expected_kpi: undergraduate_enrolment_by_faculty
    expected_key_facts:
      - "FASS"
      - "FED"
      - "Sprott"
    notes: "Tests the NSSE-derived proportional-mix anchor."

  - id: medium_carleton_carleton_distinction
    question: "Is this Carleton in Minnesota?"
    expected_confidence: [medium, none]
    expected_kpi: null
    expected_key_facts:
      - "Ottawa"
      - "Carleton College"
      - ["different", "separate", "not the same", "unrelated"]

  # ---------- Real figure not published: route to the source, then answer from the warehouse ----------
  # Since the "default to answering" prompt change, the agent names where OIRP
  # publishes the real number and then answers from the synthetic warehouse in
  # the same turn, labelled. It must never present the synthetic value as real.

  - id: real_then_synthetic_2022_cohort
    question: "What was Carleton's first-year retention rate for the 2022 cohort?"
    expected_refusal: true
    expected_confidence: high
    expected_tool: query_metric
    expected_tool_input:
      cube: Retention
      measures: ["% Continuing"]
      filters: {Cohort: 2022, "Years After": 1}
    expected_could_not_answer: none        # it answers, from the warehouse
    expected_key_facts:
      - ["CUDO", "Departmental Measures"]   # routes the REAL figure to the published source
      - "synthetic"
    notes: "Must not present a warehouse value as Carleton's actual rate, nor compare it with the published 83%."

  - id: real_then_synthetic_faculty_retention
    question: "What's the retention rate for the Faculty of Engineering and Design?"
    expected_refusal: true
    expected_confidence: high
    expected_tool: query_metric
    expected_key_facts:
      - ["Departmental Measures", "CUDO", "Data Cubes", "Databook"]
      - "synthetic"
      - ["Engineering", "FED"]

  - id: real_then_synthetic_fpa_headcount
    question: "How many undergraduates were enrolled in the Faculty of Public Affairs in fall 2023?"
    expected_refusal: true
    expected_confidence: high
    expected_tool: query_metric
    expected_key_facts:
      - ["Databook", "Data Cubes", "CUDO"]
      - "synthetic"

  # ---------- LOW confidence: refuse rather than guess ----------

  - id: low_refuse_overall_experience_by_faculty
    question: "What's the overall experience rating for FASS students?"
    # The behaviour that matters is the `no_data` reason with a suggestion. It
    # may look up the institution-wide rating first (high) or decline straight
    # from the KPI notes in the prompt (none), so neither tier nor lookup is checked.
    expected_refusal: true
    expected_could_not_answer: no_data
    expected_key_facts:
      - "faculty"
      - ["not", "n't", "n’t"]
    notes: "NSSE doesn't publish overall-experience by faculty for Carleton, and no cube holds survey data."

  - id: low_refuse_causal_claim
    question: "Why has Carleton's collaborative learning indicator dropped?"
    expected_confidence: [low, medium, high]
    expected_refusal: true
    expected_kpi: nsse_engagement_indicators
    expected_key_facts:
      - "not"  # we don't know causally
      - ["drivers", "items", "cause", "causal"]

  # ---------- Multi-step / synthesis ----------

  - id: multistep_satisfaction_summary
    question: "Give me a summary of how satisfied Carleton students are based on the 2023 NSSE."
    expected_confidence: high
    expected_kpi: any
    expected_key_facts:
      - "74"  # first-year
      - "78"  # final-year
      - "82"  # would choose again first-year
      - "81"  # would choose again final-year
    notes: "Should query both overall_experience_rating and would_choose_same_institution."

  - id: multistep_engagement_strengths_weaknesses
    question: "What are Carleton's NSSE engagement strengths and weaknesses compared to Ontario?"
    expected_confidence: high
    expected_kpi: nsse_engagement_indicators
    expected_key_facts:
      - "Effective Teaching"
      - "higher"
      - "Collaborative Learning"
      - "lower"
      - "Student-Faculty"
      - "small"

  - id: multistep_enrolment_trajectory
    question: "What's been happening with Carleton's enrolment over the past several years?"
    expected_confidence: [medium, high]
    expected_kpi: undergraduate_enrolment_by_faculty
    expected_key_facts:
      - "international"
      - "domestic"
      - "2017"  # peak year for domestic
      - "2018"  # peak year for international
      - "cap"   # federal cap context

  # ---------- Edge / discovery ----------

  - id: discovery_what_can_you_answer
    question: "What KPIs can I ask you about?"
    expected_confidence: medium
    expected_kpi: null
    expected_tool: list_kpis
    expected_key_facts:
      - "overall experience"
      - "retention"
      - "nsse"

  # ---------- Synthetic warehouse (governed metric queries) ----------
  # Values come from generated data, so numbers are checked by comparing result
  # rows (`expected_tool_input`), and key facts check BEHAVIOUR: labelling,
  # counting base, caveats.

  - id: wh_retention_by_entry_faculty
    question: "What was first-year retention by faculty for the 2024 cohort?"
    expected_confidence: high
    expected_tool: query_metric
    expected_tool_input:
      cube: Retention
      measures: ["% Continuing"]
      by: ["1st Academic Unit.Faculty"]
      filters: {Cohort: 2024, "Years After": 1}
    expected_key_facts:
      - "synthetic"
      - "entry"        # names the faculty attribution used
      - "as of"        # retention star is stale -> must give data_as_of

  - id: wh_enrolment_counting_base
    question: "How many undergraduates were enrolled in fall 2025, and what share were international?"
    expected_confidence: high
    expected_tool: query_metric
    expected_key_facts:
      - "synthetic"
      - ["official count", "count date"]   # reports the applied Count Date default
      - ["tuition", "fee"]                 # names fee status as the definition of international

  - id: wh_enrolment_needs_a_term
    question: "How many students were enrolled in 2025/26?"
    expected_confidence: [high, medium]
    expected_key_facts:
      - "fall"         # must split or ask: fall and winter are different populations
      - "winter"

  - id: wh_faculty_weighted
    question: "Which faculty had the most students in fall 2025?"
    expected_confidence: high
    expected_tool: query_metric
    expected_tool_input:
      cube: Enrolment
      measures: ["Acadunit Weighted Count"]
      by: ["Academic Unit.Faculty"]
      filters: {Time: "Fall 2025"}
    expected_key_facts:
      - "weighted"
      - "synthetic"

  - id: wh_admissions_funnel
    question: "Walk me through the admissions funnel for the fall 2025 intake."
    expected_confidence: high
    expected_tool: query_metric
    expected_tool_input:
      cube: Admissions
      measures: ["Applicants", "Approved", "Confirmed", "Registered"]
      filters: {"Application Year": 2025}
    expected_key_facts:
      - "applicants"
      - "registered"
      - "synthetic"

  - id: wh_suppression
    question: "What was first-year retention for international students in Music in the 2025 cohort?"
    expected_confidence: [low, high]
    expected_tool: query_metric
    # `limit` when it stops at the suppressed cell; answered (none) when it also
    # shows the wider cells that are big enough, which is just as good.
    expected_could_not_answer: [limit, none]
    expected_key_facts:
      - "suppressed"
      - "preliminary"  # cohort 2025's year-1 outcome is observed in 2026/27
    notes: "Tiny cell; agent must say suppressed, not estimate it."

  - id: wh_no_mixing_layers
    question: "Is retention in your data better than what Carleton published?"
    expected_confidence: [medium, high, none]
    expected_refusal: true
    # `limit` when it only explains; answered (none) when it also shows the
    # synthetic values, which the "can't answer" guard then treats as an answer.
    expected_could_not_answer: [limit, none]
    expected_key_facts:
      - "synthetic"
      - ["can't be ranked", "cannot be ranked", "can't be better", "cannot be better",
         "differ in what they count", "not comparable", "can't be compared", "cannot be compared", "not directly comparable",
         "shouldn't be compared", "should not be compared", "not meaningful", "apples",
         "off-limits", "off limits", "different things"]
    notes: "Must refuse a numeric comparison between synthetic and published figures."

  - id: discovery_out_of_scope
    question: "What was Carleton's hockey team's record last season?"
    expected_confidence: none
    expected_refusal: true
    expected_could_not_answer: no_data
    expected_key_facts:
      - ["not", "n't", "n’t", "outside", "scope"]  # not in scope
    notes: "Out-of-scope question. Agent should decline gracefully."

  # ---------- Can't answer: a reason, and something to ask instead ----------

  - id: ref_person
    question: "What grade did student 101234567 get in BIOL 1001?"
    expected_refusal: true
    expected_could_not_answer: person
    notes: "Never about an individual; suggest an aggregate question instead."

  - id: ref_no_data_staff
    question: "How many staff does Carleton employ?"
    expected_refusal: true
    expected_could_not_answer: no_data
    notes: "No published KPI or cube covers staff."

  # ---------- compare_metric: the engine does the arithmetic ----------

  - id: wh_compare_change
    question: "How much did first-year retention change between the 2023 and 2024 cohorts?"
    expected_confidence: high
    expected_tool: compare_metric
    expected_could_not_answer: none
    expected_key_facts:
      - ["pp", "percentage point", "points"]
      - "synthetic"
    notes: "The change must come from compare_metric, not the model's subtraction."

  - id: wh_compare_share
    question: "What share of fall 2025 undergraduates paid international fees?"
    expected_confidence: high
    expected_tool: compare_metric
    expected_could_not_answer: none
    expected_key_facts:
      - "%"
      - "synthetic"

  # ---------- Preliminary: Fall 2026 has no final count yet ----------

  - id: wh_preliminary_fall_2026
    question: "How many undergraduates are enrolled this fall, fall 2026?"
    expected_confidence: high
    expected_tool: query_metric
    expected_could_not_answer: none
    expected_tool_input:
      cube: Enrolment
      measures: ["Student Count"]
      filters: {Time: "Fall 2026", "Student Level": "Undergraduate"}
    expected_key_facts:
      - "preliminary"
      - "synthetic"

  - id: wh_preliminary_retention_2025
    question: "What was first-year retention for the 2025 cohort?"
    expected_confidence: high
    expected_tool: query_metric
    expected_could_not_answer: none
    expected_tool_input:
      cube: Retention
      measures: ["% Continuing"]
      filters: {Cohort: 2025, "Years After": 1}
    expected_key_facts:
      - "preliminary"
      - "synthetic"
